<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324A">
<title>อะไหล่ WPS1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="appName">อะไหล่ WPS1</h1>
  <span id="sync" class="sync" role="status"></span>
  <button id="menuBtn" class="icon-btn" aria-label="เมนู" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
  <div id="menu" class="menu" hidden>
    <p id="who" class="menu-who"></p>
    <button data-act="reload">โหลดข้อมูลใหม่</button>
    <a id="sheetLink" target="_blank" rel="noopener">เปิด Google Sheet</a>
    <button data-act="logout">ออกจากระบบ</button>
  </div>
</header>

<main id="main">
  <!-- เข้าใช้งาน / ข้อความ -->
  <section id="v-msg" class="msg" hidden>
    <h2 id="msgTitle"></h2>
    <p id="msgText"></p>
    <form id="login" hidden>
      <label>รหัสทีม<input id="loginKey" type="password" autocomplete="current-password" required></label>
      <label>ชื่อผู้ใช้<input id="loginName" autocomplete="name" required placeholder="ใช้บันทึกว่าใครทำรายการ"></label>
      <button class="btn primary" type="submit">เข้าใช้งาน</button>
    </form>
    <button id="msgBtn" class="btn" hidden></button>
  </section>

  <!-- อะไหล่ -->
  <section id="v-parts" class="view" hidden>
    <div class="toolbar">
      <input id="q" type="search" placeholder="ค้นหารหัส ชื่อ ตำแหน่ง หมายเหตุ" aria-label="ค้นหาอะไหล่">
      <div class="chips" id="partFilters">
        <button data-f="all" class="on">ทั้งหมด</button>
        <button data-f="instock">มีของ</button>
        <button data-f="out">หมดคลัง</button>
        <button data-f="unchecked">ยังไม่ตรวจปีนี้</button>
      </div>
      <div id="locFilter" class="loc-filter" hidden></div>
    </div>
    <p class="count" id="partCount"></p>
    <ul class="list" id="partList"></ul>
    <button class="fab" id="addPart" aria-label="เพิ่มอะไหล่">+ เพิ่มอะไหล่</button>
  </section>

  <!-- ตำแหน่ง -->
  <section id="v-locs" class="view" hidden>
    <div id="locGroups"></div>
  </section>

  <!-- ใบเบิก -->
  <section id="v-docs" class="view" hidden>
    <div class="toolbar">
      <div class="chips" id="docFilters">
        <button data-f="all" class="on">ทั้งหมด</button>
        <button data-f="Draft">ร่าง</button>
        <button data-f="Approved">อนุมัติแล้ว</button>
      </div>
    </div>
    <ul class="list" id="docList"></ul>
    <button class="fab" id="addDoc">+ สร้างใบเบิก</button>
  </section>
</main>

<nav class="tabs" id="tabs" hidden>
  <button data-v="parts" class="on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>อะไหล่</span></button>
  <button data-v="locs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h16v6H4z"/></svg><span>ตำแหน่ง</span></button>
  <button id="scanBtn" class="scan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"/></svg><span>สแกน</span></button>
  <button data-v="docs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg><span>ใบเบิก</span></button>
</nav>

<!-- หน้าซ้อน (รายละเอียด, ฟอร์ม) -->
<div id="panels"></div>

<!-- สแกน QR -->
<div id="scanner" class="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div class="scan-frame"></div>
  <p class="scan-hint" id="scanHint">เล็ง QR บนอะไหล่ให้อยู่ในกรอบ</p>
  <form class="scan-manual" id="scanManual">
    <input id="scanInput" placeholder="หรือพิมพ์รหัสอะไหล่" autocomplete="off">
    <button class="btn" type="submit">ค้นหา</button>
  </form>
  <button class="btn scan-close" id="scanClose">ปิด</button>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/jsQR.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
